<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <mask id="cassette-cutout" maskUnits="userSpaceOnUse">
        <rect x="0" y="0" width="128" height="128" fill="black" />
        <rect x="10" y="26" width="108" height="76" rx="14" fill="white" />
        <circle cx="42" cy="82" r="15" fill="black" />
        <circle cx="86" cy="82" r="15" fill="black" />
    </mask>
    <rect
        class="fg"
        x="0"
        y="0"
        width="128"
        height="128"
        mask="url(#cassette-cutout)"
    />
    <style>
        .fg { fill: #000; }
        @media (prefers-color-scheme: dark) {
            .fg { fill: #FFF; }
        }
    </style>
</svg>
